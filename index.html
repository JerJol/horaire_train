<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horaires Trains SNCF</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23d4262d' d='M12 2c-4 0-7 3-7 7v7c0 1.1.9 2 2 2h2v-4h2v4h2v-4h2v4h2v-4h2c1.1 0 2-.9 2-2V9c0-4-3-7-7-7zm-2 9H7v-2h3v2zm5 0h-3v-2h3v2zm5 0h-3v-2h3v2z'/></svg>" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Horaires Trains <small style="font-size: 0.5em; color: #666;">v4.2</small></h1>
            <button class="settings-icon-btn" onclick="showSettings()" title="Paramètres">⚙️</button>
        </div>
        
        <div class="search-section">
            <div class="form-group">
                <label for="departure">Gare de départ:</label>
                <input type="text" id="departure" placeholder="Ex: Paris">
            </div>
            <div class="form-group">
                <label for="arrival">Gare d'arrivée:</label>
                <input type="text" id="arrival" placeholder="Ex: Lyon">
            </div>
            <div class="form-group">
                <label for="datetime">Date et heure:</label>
                <div class="datetime-input">
                    <input type="datetime-local" id="datetime">
                    <button type="button" onclick="setNow()" class="now-btn" title="Mettre à l'heure actuelle">⌚</button>
                </div>
            </div>
            <button onclick="searchTrains()" class="search-btn">Rechercher</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('outbound')">Aller</button>
            <button class="tab-btn" onclick="showTab('return')">Retour</button>
        </div>

        <div class="tab-content active" id="outbound-tab">
            <div id="outbound-trains" class="trains-list">
                <!-- Trains aller seront affichés ici -->
            </div>
        </div>

        <div class="tab-content" id="return-tab">
            <div id="return-trains" class="trains-list">
                <!-- Trains retour seront affichés ici -->
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSettings()">&times;</span>
            <h2>Paramètres</h2>
            <div class="form-group">
                <label for="default-departure">Gare de départ par défaut:</label>
                <input type="text" id="default-departure" placeholder="Ex: Paris">
            </div>
            <div class="form-group">
                <label for="default-arrival">Gare d'arrivée par défaut:</label>
                <input type="text" id="default-arrival" placeholder="Ex: Lyon">
            </div>
            <div class="form-group">
                <label for="min-connection-time">Attente mini correspondance (minutes):</label>
                <input type="number" id="min-connection-time" value="5" min="0" max="60">
            </div>
            <button onclick="saveSettings()" class="save-btn">Enregistrer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
